<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Students Manager</h1>
        <p>Node.js + Express REST API</p>
    </header>

    <main class="container">
        <section class="card">
            <h2 id="form-title">Add Student</h2>
            <form id="student-form" novalidate>
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter name">
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter email">
                </div>
                <div class="field">
                    <label for="program">Program</label>
                    <input type="text" id="program" placeholder="BSCS">
                </div>
                <div class="actions">
                    <button type="submit" id="submit-btn" class="btn primary">Add Student</button>
                    <button type="button" id="cancel-btn" class="btn secondary hidden">Cancel</button>
                </div>
            </form>
            <p id="message" class="message"></p>
        </section>

        <section class="card">
            <div class="list-header">
                <h2>All Students <span id="count" class="badge">0</span></h2>
                <input type="text" id="filter" class="filter" placeholder="Filter by program (e.g. BSCS)">
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Program</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
